[workspace]
resolver = "2"
members = ["crates/btc", "crates/wots", "crates/risc0"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lichenbtc-org/lichen-btc"

[workspace.dependencies]
lichen-btc = { path = "crates/btc" }
bitcoin = { version = "0.32", features = ["rand-std", "serde"] }
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
bitcoincore-rpc = "0.19"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
rand = "0.8"
hex = "0.4"
tempfile = "3"

# Dependencies (secp256k1, the hash crates) optimised even in debug builds:
# the regtest tests are hash- and signature-bound, and secp256k1's C code
# takes the profile's opt level.
[profile.dev.package."*"]
opt-level = 2
