name: CI

# Push and PR: lint and build, then every test (the regtest ones start
# throwaway bitcoinds, so the job installs Bitcoin Core).

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  BITCOIN_VERSION: "31.0"
  BITCOIN_SHA256: d3e4c58a35b1d0a97a457462c94f55501ad167c660c245cb1ffa565641c65074

jobs:
  test:
    name: Clippy and tests (regtest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bitcoind
      - uses: Swatinem/rust-cache@v2
      # Advisory: clippy's warnings do not fail the job.
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace
