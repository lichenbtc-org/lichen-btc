[package]
name = "lichen-btc"
description = "A thin layer over rust-bitcoin: keys, taproot trees, sighash, transactions, witnesses, adaptor signatures, a regtest bitcoind"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bitcoin.workspace = true
secp256k1.workspace = true
bitcoincore-rpc.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# MuSig2 (BIP327); the k256 backend, so its secp256k1 needn't match bitcoin's
musig2 = { version = "0.4", default-features = false, features = ["k256"] }
